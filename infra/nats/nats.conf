server_name: rabbehni-local
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 512MB
  max_file_store: 5GB
}

authorization {
  users: [
    {
      user: $NATS_USER
      password: $NATS_PASSWORD
      permissions: {
        publish: "rabbehni.>"
        subscribe: ["rabbehni.>", "_INBOX.>"]
      }
    }
  ]
}
