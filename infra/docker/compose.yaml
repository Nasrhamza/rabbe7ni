name: rabbehni

services:
  admin-web:
    profiles: ["applications"]
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${ADMIN_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  merchant-web:
    profiles: ["applications"]
    build:
      context: ../..
      dockerfile: apps/merchant-web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${MERCHANT_WEB_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3002/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  api:
    profiles: ["applications"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_VERSION: ${SERVICE_VERSION}
      API_PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_BACKCHANNEL_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL}
      OIDC_ALLOWED_REDIRECT_URIS: ${OIDC_ALLOWED_REDIRECT_URIS}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BULLMQ_PREFIX: ${BULLMQ_PREFIX}
      ANALYTICS_SERVICE_URL: http://analytics-service:4100
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-rabbehni-local-internal-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  ai-service:
    profiles: ["applications"]
    build:
      context: ../..
      dockerfile: apps/ai-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_VERSION: ${SERVICE_VERSION}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-rabbehni-local-internal-token}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-3}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-deterministic-analytics-v1}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-analytics-explain-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  analytics-service:
    profiles: ["applications"]
    build:
      context: ../..
      dockerfile: apps/analytics-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_VERSION: ${SERVICE_VERSION}
      ANALYTICS_PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-rabbehni-local-internal-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${ANALYTICS_PORT:-4100}:4100"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  notification-worker:
    profiles: ["applications"]
    build:
      context: ../..
      dockerfile: apps/notification-worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_VERSION: ${SERVICE_VERSION}
      NOTIFICATION_WORKER_PORT: 4101
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BULLMQ_PREFIX: ${BULLMQ_PREFIX}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${NOTIFICATION_WORKER_PORT:-4101}:4101"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4101/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  redis:
    image: ${REDIS_IMAGE:-redis:8.2-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  nats:
    image: ${NATS_IMAGE:-nats:2.12-alpine}
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_USER: ${NATS_USER}
      NATS_PASSWORD: ${NATS_PASSWORD}
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
      - ../nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz | grep -q 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$S3_BUCKET_ASSETS;
      mc mb --ignore-existing local/$$S3_BUCKET_REPORTS;
      mc mb --ignore-existing local/$$S3_BUCKET_MODELS;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS}
      S3_BUCKET_MODELS: ${S3_BUCKET_MODELS}
    networks:
      - rabbehni

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.0}
    profiles: ["identity"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    profiles: ["identity"]
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --metrics-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../keycloak/realm:/opt/keycloak/data/import:ro
      - ../keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - rabbehni

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.6-alpine}
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rabbehni

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.135.0}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "8889:8889"
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      - rabbehni

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    networks:
      - rabbehni

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.0}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
      - ../observability/loki.yaml:/etc/loki/config.yaml:ro
    networks:
      - rabbehni

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.8.2}
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo-data:/var/tempo
      - ../observability/tempo.yaml:/etc/tempo/config.yaml:ro
    networks:
      - rabbehni

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.0.2}
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - rabbehni

networks:
  rabbehni:
    name: rabbehni

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  clickhouse-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
