version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node-foundation:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /apps/ai-service
    schedule:
      interval: weekly
    groups:
      python-foundation:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
