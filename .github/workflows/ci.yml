name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -e "./apps/ai-service[dev]"

      - name: Generate Prisma Client
        env:
          DIRECT_DATABASE_URL: postgresql://rabbehni:ci@localhost:5432/rabbehni
        run: pnpm db:generate

      - name: Validate
        env:
          DIRECT_DATABASE_URL: postgresql://rabbehni:ci@localhost:5432/rabbehni
        run: pnpm validate
